name: Build on PR

on:
  pull_request:
    branches:
      - main
    paths:
      - server/**

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Use Nodejs
        uses: actions/setup-node@v3
        with:
          node-version : "20"

      - name: Install Dependencies
        run: npm install

      - name: Start server
        run: npm start