name: Build and Deploy backend image to docker hub

on:
  push:
    branches:
      - main
    paths:
      - server/**

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v3

      - name: Login to dockerhub
        uses: docker/login-action@v1
        with:
          username: ${{secrets.DOCKER_USERNAME}}
          password: ${{secrets.DOCKER_PASSWORD}}

      - name: Build and Push Docker image
        uses: docker/build-push-action@v2
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ritikjha/shopsy-frontend:v1 # Replace with your Docker Hub username and repository

      - name: Verify Pushed Image
        run: docker pull ritikjha/shopsy-frontend:v1