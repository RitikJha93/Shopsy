name: Build Frontend on PR

on:
  pull_request:
    branches:
      - main
    paths:
      - client/**

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Use Nodejs
        uses: actions/setup-node@v3
        with:
          node-version : "20"

      - name: Install Dependencies
        run: npm install --legacy-peer-deps
        working-directory : ./client

      - name: Build
        run: npm run build
        working-directory : ./client
