name: Build and Deploy frontend image to Docker Hub

on:
  push:
    branches:
      - main
    paths:
      - client/**

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Check Out Repo
        uses: actions/checkout@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v1
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker image
        uses: docker/build-push-action@v2
        with:
          context: ./client
          file: ./client/Dockerfile
          push: true
          tags: ritikjha/shopsy-frontend:v1 # Replace with your Docker Hub username and repository

      - name: Verify Pushed Image
        run: docker pull ritikjha/shopsy-frontend:v1 # Replace with your Docker Hub username and repository

      - name: Deploy to Docker EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{secrets.SSH_HOST}}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_SECRET }}
          script: |
            sudo docker pull ritikjha/shopsy-frontend:v1
            sudo docker stop shopsy-frontend || true
            sudo docker rm shopsy-frontend || true
            sudo docker run -d --name shopsy-frontend -p 3005:3000 -e REACT_APP_BACKEND_URL=${{secrets.REACT_APP_BACKEND_URL}} ritikjha/shopsy-frontend:v1
